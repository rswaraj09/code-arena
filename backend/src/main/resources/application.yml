spring:
  application:
    name: codearena-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://swarajritik_db_user:m9rbwAbkCCr1kNuh@cluster0.4ykba4o.mongodb.net/code-arena?retryWrites=true&w=majority}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

codearena:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret-please}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}      # 15 minutes
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM_EMAIL:CodeArena <onboarding@resend.dev>}
  judge:
    workdir: ${JUDGE_WORKDIR:/tmp/codearena-submissions}
    execution-timeout-seconds: ${JUDGE_TIMEOUT_SECONDS:10}
    memory-limit-mb: ${JUDGE_MEMORY_MB:256}
    cpu-limit: ${JUDGE_CPU_LIMIT:1}
    pids-limit: ${JUDGE_PIDS_LIMIT:64}
