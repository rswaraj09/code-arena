version: "3.8"

# Reads a .env file in this same directory automatically (Docker Compose's
# built-in behavior) — copy .env.example to .env and set MONGODB_URI.

services:
  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGODB_URI: ${MONGODB_URI}
    ports:
      - "8080:8080"
    volumes:
      # Lets the backend container launch sibling Docker containers for the judge
      - /var/run/docker.sock:/var/run/docker.sock
      - codearena-submissions:/tmp/codearena-submissions

volumes:
  codearena-submissions:
